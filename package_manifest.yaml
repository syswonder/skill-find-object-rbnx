manifestVersion: 1

package:
  name: robonix.skill.find_object
  version: 0.1.0
  description: Capture an annotated 360-degree camera sweep for Pilot object recognition.
  tags: [skill, camera, object-search, lite3]
  maintainers: [Bunnycxk <2501213313@stu.pku.edu.cn>]
  license: Apache-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

capabilities:
  - name: robonix/skill/find_object/driver
    path: capabilities/driver.v1.toml
  - name: robonix/skill/find_object/scan
    path: capabilities/scan.v1.toml
